name: Daily Repository Maintenance

on:
  schedule:
    - cron: '45 18 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update maintenance log
        run: |
          mkdir -p .github
          printf '%s\n' "$(date -u '+%Y-%m-%d') — automated repository maintenance" >> .github/daily-maintenance.log

      - name: Commit maintenance update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/daily-maintenance.log

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: daily repository maintenance"
            git push
          fi
